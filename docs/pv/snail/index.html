<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>蜗牛与向日葵</title>
<style>
html,body{margin:0;background:#1b1a1d;height:100%;overflow:hidden;font:13px sans-serif;color:#bbb}
#c{position:absolute;inset:0;margin:auto;max-width:100vw;max-height:calc(100vh - 36px);aspect-ratio:16/9;width:100vw;top:0;bottom:36px}
#ui{position:absolute;left:0;right:0;bottom:0;height:36px;display:flex;gap:10px;align-items:center;padding:0 12px}
#ui input{flex:1}
body.render #ui{display:none} body.render #c{max-height:none;bottom:0}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="pp">⏸</button><input id="sl" type="range" min="0" max="48.25" step="0.0333"><span id="tm">0.00</span></div>
<script src="anim.js"></script>
<script>
const q=new URLSearchParams(location.search);
if(q.has('render')) document.body.classList.add('render');
const sl=document.getElementById('sl'),tm=document.getElementById('tm'),pp=document.getElementById('pp');
let playing=!q.has('t')&&!q.has('render'), t0=performance.now(), base=q.has('t')?parseFloat(q.get('t')):0, cur=base;
function show(t){cur=t;frame(t);sl.value=t;tm.textContent=t.toFixed(2)+'s';}
function loop(){ if(playing){let t=base+(performance.now()-t0)/1000; if(t>=DUR){base=0;t0=performance.now();t=0;} show(t);} requestAnimationFrame(loop);}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'⏸':'▶';base=cur;t0=performance.now();};
sl.oninput=()=>{playing=false;pp.textContent='▶';show(parseFloat(sl.value));};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.onclick();}
 if(e.code==='ArrowRight'){playing=false;show(Math.min(DUR,cur+1/30));} if(e.code==='ArrowLeft'){playing=false;show(Math.max(0,cur-1/30));}});
if(!q.has('render')){ show(base); pp.textContent=playing?'⏸':'▶'; loop(); }
</script></body></html>
